ple SD Gothic Neo, sans-serif">NULL</text><rect x="1041" y="306" width="688" height="38" fill="#ffffff" /><g data-column="spring_session_attributes.session_primary_id" /><text x="1054" y="331" fill="#416f65" font-size="15" font-weight="400" font-family="Menlo, monospace">PK,FK</text><text x="1180" y="331" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">session_primary_id</text><text x="1540" y="331" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">char(36)</text><text x="1690" y="331" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">N</text><rect x="1041" y="344" width="688" height="38" fill="#f4f7f8" /><g data-column="spring_session_attributes.attribute_name" /><text x="1054" y="369" fill="#416f65" font-size="15" font-weight="400" font-family="Menlo, monospace">PK</text><text x="1180" y="369" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">attribute_name</text><text x="1540" y="369" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">varchar(200)</text><text x="1690" y="369" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">N</text><rect x="1041" y="382" width="688" height="38" fill="#ffffff" /><g data-column="spring_session_attributes.attribute_bytes" /><text x="1054" y="407" fill="#416f65" font-size="15" font-weight="400" font-family="Menlo, monospace" /><text x="1180" y="407" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">attribute_bytes</text><text x="1540" y="407" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">bytea</text><text x="1690" y="407" fill="#22343e" font-size="15" font-weight="400" font-family="Menlo, monospace">N</text><line x1="790" y1="340" x2="1040" y2="340" stroke="#426b65" stroke-width="2" /><line x1="801" y1="331" x2="801" y2="349" stroke="#426b65" stroke-width="2" /><line x1="810" y1="331" x2="810" y2="349" stroke="#426b65" stroke-width="2" /><circle cx="1008" cy="340" r="5" fill="white" stroke="#426b65" stroke-width="2" /><line x1="1021" y1="340" x2="1040" y2="332" stroke="#426b65" stroke-width="2" /><line x1="1021" y1="340" x2="1040" y2="340" stroke="#426b65" stroke-width="2" /><line x1="1021" y1="340" x2="1040" y2="348" stroke="#426b65" stroke-width="2" /><text x="835" y="314" fill="#426b65" font-size="16" font-weight="400" font-family="Arial, Apple SD Gothic Neo, sans-serif">1 → 0..N · CASCADE</text><text x="70" y="665" fill="#22343e" font-size="20" font-weight="400" font-family="Arial, Apple SD Gothic Neo, sans-serif">principal_name은 인증 주체 식별 문자열이며 users에 대한 DB FK가 아닙니다.</text><text x="70" y="704" fill="#22343e" font-size="20" font-weight="400" font-family="Arial, Apple SD Gothic Neo, sans-serif">사용자 연결·CSRF 토큰·SecurityContext는 서버 세션 속성으로 저장합니다.</text><text x="70" y="743" fill="#22343e" font-size="20" font-weight="400" font-family="Arial, Apple SD Gothic Neo, sans-serif">스키마 변경은 V3로 관리하며 앱 실행 역할은 두 테이블의 조회·추가·수정·삭제 권한을 가집니다.</text></svg>