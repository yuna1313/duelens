spring.application.name=duelens-backend
server.address=127.0.0.1
server.port=8080
management.endpoints.web.base-path=/internal-management
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.config.import=optional:file:./config/local.properties
spring.datasource.url=${DUELENS_DB_URL}
spring.datasource.username=${DUELENS_DB_USERNAME}
spring.datasource.password=${DUELENS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never

spring.flyway.user=${DUELENS_MIGRATION_USERNAME}
spring.flyway.password=${DUELENS_MIGRATION_PASSWORD}
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
duelens.security.cookie-secure=${DUELENS_COOKIE_SECURE:true}
duelens.security.write-origins=${DUELENS_WRITE_ORIGINS:}
duelens.security.new-sessions-per-minute=60
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# Local documentation is explicitly enabled in ignored local configuration.
duelens.api-docs.enabled=${DUELENS_API_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${DUELENS_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${DUELENS_API_DOCS_ENABLED:false}
springdoc.swagger-ui.url=/api/docs/openapi.json
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.query-config-enabled=false
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.filter=true
